name: GibVid
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
targets:
  GibVid:
    type: application
    platform: iOS
    sources:
      - path: GibVid
      # Code Python de l'app et paquets (yt-dlp…), copiés tels quels dans le bundle.
      - path: python/app
        type: folder
        buildPhase: resources
      - path: python/app_packages
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Vendor/Python.xcframework
        embed: true
      - sdk: JavaScriptCore.framework
    info:
      path: GibVid/Info.plist
      properties:
        CFBundleDisplayName: Gib Vid
        CFBundleURLTypes:
          - CFBundleURLName: "$(PRODUCT_BUNDLE_IDENTIFIER)"
            CFBundleURLSchemes: [gibvid]
        NSPhotoLibraryAddUsageDescription: Gib Vid enregistre les vidéos téléchargées dans tes Photos.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        # BeeWare installe les extensions Python d’une seule architecture par bundle.
        "ARCHS[sdk=iphonesimulator*]": "$(NATIVE_ARCH_ACTUAL)"
        PRODUCT_NAME: GibVid
        PRODUCT_BUNDLE_IDENTIFIER: org.example.GibVid
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: GibVid/Bridge/GibVid-Bridging-Header.h
        # Le script d'installation de Python lit Vendor/ et écrit dans le bundle.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO
    postBuildScripts:
      - name: Install Python
        basedOnDependencyAnalysis: false
        script: |
          set -e
          source "$PROJECT_DIR/Vendor/Python.xcframework/build/utils.sh"
          install_python Vendor/Python.xcframework app_packages
